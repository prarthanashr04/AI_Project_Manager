<div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2>{{ modalTitle }}</h2>
            <button class="close-btn" (click)="onClose()">✕</button>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label>Title *</label>
                <input type="text" placeholder="Enter task title" [(ngModel)]="task.title" />
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea placeholder="Enter task description" [(ngModel)]="task.description"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Priority</label>
                    <select [(ngModel)]="task.priority">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select [(ngModel)]="task.status">
                        <option value="TODO">TODO</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="DONE">Done</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Assignee</label>
                    <input type="text" placeholder="Name" [(ngModel)]="task.assignee" />
                </div>

                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" [(ngModel)]="task.dueDate" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Estimated Hours</label>
                    <input type="number" placeholder="0" [(ngModel)]="task.estimatedHours" />
                </div>

                <div class="form-group">
                    <label>Labels</label>
                    <input type="text" placeholder="Comma separated" [(ngModel)]="task.labels" />
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-primary" (click)="onSave()">{{ isCreateMode ? '+ Create Task' : 'Save Changes'
                }}</button>
            <button class="btn btn-secondary" (click)="onClose()">Cancel</button>
        </div>
    </div>
</div>
